BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-fwu"
BBFILE_PATTERN_meta-mender-fwu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-fwu = "10"

LAYERSERIES_COMPAT_meta-mender-fwu = "wrynose"
LAYERDEPENDS_meta-mender-fwu = "core mender"

# GPT type UUID used to locate FWU metadata partitions. Used both by the
# wic file and by the device-tree fragment that points U-Boot at the
# metadata partitions.
FWU_MDATA_TYPE_UUID ?= "8a7a84a0-8387-40f6-ab41-a8b9a5a60d23"

# image_type_guid values used in the FWU metadata for kernel and rootfs.
# Per-bank image_guid values are derived in the metadata-seeding recipe.
FWU_KERNEL_IMAGE_TYPE_UUID ?= "fd2ba1cf-0f04-4f44-8e7c-44e9c8c5cd5f"
FWU_ROOTFS_IMAGE_TYPE_UUID ?= "f1d3e7a0-5f6e-4b8c-9d2e-1a3b5c7d9e2f"

# Per-bank, per-image instance GUIDs. These appear in GPT partition
# unique UUIDs so U-Boot can match a capsule's image_type_guid +
# bank index to a concrete partition.
FWU_BANK0_KERNEL_IMAGE_UUID ?= "10000000-0000-0000-0000-000000000001"
FWU_BANK0_ROOTFS_IMAGE_UUID ?= "10000000-0000-0000-0000-000000000002"
FWU_BANK1_KERNEL_IMAGE_UUID ?= "10000000-0000-0000-0000-000000000011"
FWU_BANK1_ROOTFS_IMAGE_UUID ?= "10000000-0000-0000-0000-000000000012"

# Expose the FWU_* variables to wic templates so qemuarm64-fwu.wks.in
# can substitute the UUIDs into --part-type and --uuid parameters.
WICVARS:append = " \
    FWU_MDATA_TYPE_UUID \
    FWU_KERNEL_IMAGE_TYPE_UUID \
    FWU_ROOTFS_IMAGE_TYPE_UUID \
    FWU_BANK0_KERNEL_IMAGE_UUID \
    FWU_BANK0_ROOTFS_IMAGE_UUID \
    FWU_BANK1_KERNEL_IMAGE_UUID \
    FWU_BANK1_ROOTFS_IMAGE_UUID \
    "
