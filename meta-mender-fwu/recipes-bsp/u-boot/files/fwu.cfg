# U-Boot configuration fragment enabling FWU Multi Bank Update plus
# UEFI capsule-on-disk delivery. Targets U-Boot v2024.01 (scarthgap).
#
# Reference: https://docs.u-boot.org/en/v2024.01/develop/uefi/fwu_updates.html
#
# This fragment is only applied when FWU_UBOOT_ENABLE = "1" (Stage 1
# and Stage 3). In Stage 2 the stock meta-mender U-Boot env-based A/B
# scheme is used and these CONFIGs stay off.
#
# IMPORTANT: U-Boot v2024.01 only supports FWU metadata V1. V2 was
# introduced later and is NOT available on scarthgap.

CONFIG_EFI_LOADER=y
CONFIG_EFI_CAPSULE_ON_DISK=y
CONFIG_EFI_CAPSULE_ON_DISK_EARLY=y
CONFIG_EFI_CAPSULE_FIRMWARE_MANAGEMENT=y
CONFIG_EFI_CAPSULE_FIRMWARE=y
CONFIG_EFI_CAPSULE_FIRMWARE_RAW=y
CONFIG_CMD_EFIDEBUG=y
CONFIG_CMD_NVEDIT_EFI=y

CONFIG_FWU_MDATA=y
CONFIG_FWU_MDATA_GPT_BLK=y
CONFIG_FWU_MULTI_BANK_UPDATE=y
CONFIG_FWU_NUM_BANKS=2
CONFIG_FWU_NUM_IMAGES_PER_BANK=2
CONFIG_FWU_TRIAL_STATE_CNT=3
CONFIG_CMD_FWU_METADATA=y
# 2024.01 only had V1; 2025.04 splits V1 and V2 as mutually-exclusive
# Kconfig options. Our seeded metadata is V1.
CONFIG_FWU_MDATA_V1=y

# Required by FWU_MDATA_GPT_BLK; usually selected automatically but
# pinning here for clarity.
CONFIG_PARTITION_TYPE_GUID=y
CONFIG_PARTITION_UUIDS=y

# Adds the virtio DFU backend introduced by patch 0004. Required so
# that capsule payloads landing in the FWU agent can be written to
# the virtio-blk OS disk; without this the FWU update path falls back
# to the MTD backend (which then complains about nor0 sizing on the
# qemu-arm flash device) and refuses the update.
CONFIG_DFU_VIRTIO=y

# Default U-Boot config gives SYS_MALLOC_LEN = 16 MiB and
# SYS_DFU_DATA_BUF_SIZE = 8 MiB, but DFU init allocates one such buf
# per alt entity (4 of them in our FWU setup) plus assorted other
# heap users, so all-but-one allocation fails. Shrink the per-entity
# buffer well below the heap budget; 1 MiB is plenty for sector-based
# block writes.
CONFIG_SYS_DFU_DATA_BUF_SIZE=0x100000

# Lift the malloc heap so the EFI capsule loader can read a real
# rootfs capsule into RAM in one shot. efi_capsule_read_file()
# mallocs the whole capsule -- a Stage 3 rootfs.ext4 is ~900 MiB, so
# the default 16 MiB heap is far too small. 1 GiB fits with margin
# inside the 2 GiB we hand QEMU; on real hardware production should
# either size DRAM accordingly or move U-Boot's capsule reader to a
# streaming model upstream.
CONFIG_SYS_MALLOC_LEN=0x40000000

# Skip the OsIndications check in the EFI capsule-on-disk path.
#
# Per U-Boot's UEFI doc: "Since U-Boot doesn't currently support
# SetVariable at runtime, [OsIndications] value won't be taken over
# across the reboot. If this is the case, you can skip this feature
# check with the Kconfig option (CONFIG_EFI_IGNORE_OSINDICATIONS) set."
#
# Without this, Linux userspace cannot trigger a capsule update -- it
# can drop the capsule file into /boot/efi/EFI/UpdateCapsule/, but the
# only way to set OsIndications.PROCESS_CAPSULE_UPDATES so U-Boot picks
# it up on the next boot is through the EFI runtime SetVariable, which
# U-Boot does not implement post-ExitBootServices. With IGNORE_
# OSINDICATIONS=y, "drop file + reboot" is sufficient.
CONFIG_EFI_IGNORE_OSINDICATIONS=y
