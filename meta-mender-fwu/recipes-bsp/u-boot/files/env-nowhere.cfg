# Switch U-Boot env from MMC to NOWHERE for any Mender-enabled build.
#
# qemu_arm64_defconfig bakes CONFIG_ENV_IS_IN_MMC=y, but the qemu virt
# machine has no MMC. Without this override mender's u-boot bbappend
# build refuses to compile (it can't find an env backing) and the
# bitbake task errors out before we even get to runtime.
#
# Pulled into the SRC_URI by both Stage 2 (FWU_UBOOT_ENABLE=0) and
# Stage 3 (FWU_UBOOT_ENABLE=1) via MENDER_UBOOT_NOWHERE_ENV=1. Stage 3
# does *not* additionally apply mender-stage2-env.cfg, which would
# also force CONFIG_BOOTCOMMAND to a path that conflicts with Stage 3's
# FWU boot.scr.uimg flow.

# CONFIG_ENV_IS_IN_MMC is not set
CONFIG_ENV_IS_IN_NOWHERE=y
