# Layer config for meta-mender-ostree: a "Family B" Mender demo where the
# rootfs is OSTree-managed and the Mender client (client-only) drives OSTree
# atomic deployments via a custom `ostree` Update Module. The OSTree-ification
# itself (read-only /usr, /var split, ostree_repo, deployment layout) comes from
# meta-updater's sota / image_types_ostree; this layer provides the qemuarm64 +
# U-Boot machine glue, the Update Module, the build-time v2 static-delta payload,
# and the demo image. See README.md.

BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-mender-ostree"
BBFILE_PATTERN_meta-mender-ostree = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-ostree = "6"

LAYERSERIES_COMPAT_meta-mender-ostree = "wrynose"
# Depends on core, the mender client recipe, and meta-updater's sota (OSTree).
LAYERDEPENDS_meta-mender-ostree = "core mender sota"

LAYERDIR_meta-mender-ostree = "${LAYERDIR}"
