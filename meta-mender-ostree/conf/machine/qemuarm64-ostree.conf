#@TYPE: Machine
#@NAME: qemuarm64-ostree
#@DESCRIPTION: qemuarm64 + U-Boot, OSTree-based rootfs for the Mender OSTree demo
#
# Based on the stock qemuarm64 machine (like qemuarm64-swupdate). U-Boot is the
# bootloader and boots the OSTree deployment; runqemu launches via u-boot.bin
# (not -kernel injection). The OSTree-ification (sota) and OSTREE_* settings are
# applied from the kas wrapper's local_conf_header.

MACHINEOVERRIDES =. "qemuarm64:"
require ${COREBASE}/meta/conf/machine/qemuarm64.conf
KMACHINE = "qemuarm64"

# U-Boot boots the OSTree deployment.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
UBOOT_MACHINE = "qemu_arm64_defconfig"
EXTRA_IMAGEDEPENDS:append = " virtual/bootloader"
OSTREE_BOOTLOADER ?= "u-boot"

# Boot via U-Boot under runqemu (mirrors qemuarm64-swupdate): no -kernel
# injection, so runqemu runs u-boot.bin which loads the OSTree boot script.
# Attach the wic as virtio-blk (/dev/vda) -- the default is SCSI (/dev/sda),
# which U-Boot's bootflow scan does not walk for boot.scr.uimg, and which would
# not match ostree_root=/dev/vda2 or the boot script's `virtio` device.
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_DRIVE_TYPE = "/dev/vda"
QB_DEFAULT_BIOS = "u-boot.bin"
QB_DEFAULT_KERNEL = "none"
QB_KERNEL_ROOT = ""
QB_DEFAULT_FSTYPE = "wic"

# OSTree physical sysroot as the rootfs (wic --source otaimage) + FAT /boot.
# The wic fstype is set on the demo image recipe (not globally) so meta-updater's
# initramfs-ostree-image does not also try to build a wic (circular dependency).
WKS_FILE = "qemuarm64-ostree.wks"
IMAGE_BOOT_FILES = "u-boot.bin boot.scr.uimg"

do_image_wic[depends] += " \
    mtools-native:do_populate_sysroot \
    dosfstools-native:do_populate_sysroot \
    virtual/bootloader:do_deploy \
    ostree-bootscr:do_deploy \
"
