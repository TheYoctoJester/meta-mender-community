# systemd-tmpfiles snippet: on first boot, copy the build-time content of
# /var/lib/mender (device_type, mender.conf, the bootstrap artifact, etc.)
# into /data/mender if it does not already exist. /data/mender is then
# bind-mounted over /var/lib/mender by var-lib-mender.mount, so the Mender
# state DB and the agent key live on the persistent data partition and
# survive an OTA-driven rootfs swap.
#
# Type 'C' copies a tree from the trailing argument to the path only if the
# path does not already exist.
C /data/mender 0700 root root - /var/lib/mender
