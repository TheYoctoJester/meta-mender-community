# Kernel configuration for the systemd-boot A/B demo on qemux86-64.
#
# systemd-boot launches a Type #1 boot entry: a bzImage (EFI stub) plus a
# separate initrd, with root=PARTLABEL=... on the command line. The initrd
# (core-image-minimal-initramfs) carries udev, which resolves the PARTLABEL
# to /dev/disk/by-partlabel/mender-rootfs{a,b}. We still build the storage
# and filesystem drivers into the kernel so the disk is present regardless
# of which modules the initramfs happens to ship.

# EFI stub so the bzImage is a launchable UEFI application that systemd-boot
# (and the firmware fallback) can load directly.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFIVAR_FS=y

# Root filesystem lives on an AHCI/SATA disk (QEMU q35 ide-hd); virtio is not
# re-enumerated by OVMF across guest reboots, so this demo uses AHCI.
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_PIIX=y

# ext4 rootfs and the FAT ESP the shim writes loader entries onto.
CONFIG_EXT4_FS=y
CONFIG_MSDOS_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# virtio NIC built in (QEMU presents the network as virtio-net-pci) so the
# Mender client can reach the server without depending on loadable modules.
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_NET=y
