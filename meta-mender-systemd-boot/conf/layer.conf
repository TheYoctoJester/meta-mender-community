# Layer config for meta-mender-systemd-boot: Mender A/B updates on Yocto
# wrynose driven by stock (unpatched) systemd-boot, using systemd's native
# Automatic Boot Assessment (boot counting) for in-firmware rollback.
#
# Provides:
#   - classes/mender-systemd-boot-ab.bbclass
#         stages each slot's kernel + initrd onto the ESP under
#         /EFI/Linux/mender-{a,b}/, writes the two Type #1 Boot Loader
#         Specification entries (mender-a.conf / mender-b.conf) and an
#         initial loader.conf defaulting to slot A, stages kernel + initrd
#         into the rootfs at /usr/lib/mender/ (so a Mender rootfs artifact
#         carries the kernel for the slot it lands on), and seeds the
#         persistent /data tree + a bootstrap artifact (mender-image is
#         disabled, so we do this ourselves).
#   - recipes-bsp/mender-sdboot-shim
#         fw_setenv/fw_printenv shim that maps Mender's A/B env onto
#         systemd-boot's on-ESP state: on a slot flip it refreshes the
#         target slot's kernel/initrd on the ESP, writes the trial entry
#         with a +tries-left boot counter and points loader.conf default
#         at it; on commit it strips the counter ("blesses" the slot).
#         Also ships the /var/lib/mender -> /data/mender bind mount so the
#         Mender state DB survives the rootfs swap, and masks systemd's
#         automatic systemd-bless-boot.service so only Mender's commit
#         blesses a trial boot.
#   - recipes-kernel/linux  AHCI + ext4 + vfat + EFI stub built into the
#                           kernel (the demo uses an AHCI disk because OVMF
#                           does not re-enumerate virtio across reboots).
#   - files/wic/mender-systemd-boot-qemux86-64.wks.in
#                           4-part GPT (256M ESP, two 1G rootfs slots, 64M
#                           data) on an AHCI disk.
#
# See README.md for the design rationale and the matching kas wrapper in
# mender-community-images at branch wrynose-demos.

BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-mender-systemd-boot"
BBFILE_PATTERN_meta-mender-systemd-boot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-systemd-boot = "10"

LAYERVERSION_meta-mender-systemd-boot = "1"
LAYERDEPENDS_meta-mender-systemd-boot = "core mender"
LAYERSERIES_COMPAT_meta-mender-systemd-boot = "wrynose"

LAYERDIR_meta-mender-systemd-boot = "${LAYERDIR}"
