# Kernel configuration for the efibootmgr A/B demo on qemux86-64.
#
# The firmware launches the bzImage EFI stub directly (no initramfs, no
# intermediate bootloader), so every driver needed to reach and mount the
# rootfs must be built in, not modular.

# EFI stub so the bzImage is itself a launchable UEFI application, and runtime
# EFI variable access so efibootmgr can manage BootNext/BootOrder from Linux.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFIVAR_FS=y

# Root filesystem lives on an AHCI/SATA disk (QEMU q35 ide-hd); virtio is not
# re-enumerated by OVMF across guest reboots, so this demo uses AHCI.
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_PIIX=y

# Mount the FAT ESP at runtime to drop per-slot kernels.
CONFIG_MSDOS_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# Builtin command line used only when the firmware launches the kernel with no
# load options, i.e. the EFI/BOOT/bootx64.efi fallback on the very first boot
# before the UEFI boot entries exist. On x86 the bootloader/LoadOptions command
# line is appended after this one, and the last root= wins, so the per-slot
# UEFI entries (which pass root=PARTUUID via efibootmgr -u) still take effect.
#
# IMPORTANT: the PARTUUID below must match MENDER_EFIBOOTMGR_ROOTA_UUID in
# meta-mender-efibootmgr/conf/layer.conf and the rootA --uuid in the wic file.
CONFIG_CMDLINE_BOOL=y
CONFIG_CMDLINE="root=PARTUUID=aaaaaaaa-0000-0000-0000-00000000000a rootwait rw console=ttyS0,115200"
