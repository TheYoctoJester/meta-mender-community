# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-efibootmgr"
BBFILE_PATTERN_meta-mender-efibootmgr = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-efibootmgr = "10"

LAYERVERSION_meta-mender-efibootmgr = "1"
LAYERDEPENDS_meta-mender-efibootmgr = "core mender"
LAYERSERIES_COMPAT_meta-mender-efibootmgr = "wrynose"

# Variable to reference this layer directory in recipes and the bbclass
LAYERDIR_meta-mender-efibootmgr = "${LAYERDIR}"

# Fixed GPT partition UUIDs for the two rootfs slots. They are fixed (rather
# than auto-generated) so the kernel's builtin CONFIG_CMDLINE can reference
# rootA by PARTUUID for the very first boot and the firmware-fallback path,
# before any UEFI boot entry exists. Exposed to the wic template via WICVARS.
# (Not MENDER_-prefixed, to avoid meta-mender's "unrecognized MENDER_ variable"
# warning.)
EFIBOOTMGR_ROOTA_UUID ?= "aaaaaaaa-0000-0000-0000-00000000000a"
EFIBOOTMGR_ROOTB_UUID ?= "bbbbbbbb-0000-0000-0000-00000000000b"

WICVARS:append = " EFIBOOTMGR_ROOTA_UUID EFIBOOTMGR_ROOTB_UUID"
