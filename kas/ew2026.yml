header:
  version: 14
  includes:
  - kas/reterminal.yml
  - kas/include/mender-master.yml
  - kas/demos/reterminal-demo.yml

repos:
  meta-openembedded:
    layers:
      meta-oe:
      meta-python:

local_conf_header:
  zzz-orchestrator: |
    MENDER_DEVICE_TIER = "system"
    LICENSE_FLAGS_ACCEPTED:append = " commercial_mender-yocto-layer-license"
    IMAGE_INSTALL:append = " mender-orchestrator mender-orchestrator-support"
    IMAGE_INSTALL:append = " esp32-update-interface python3-esptool"
    IMAGE_INSTALL:append = " jq"
    IMAGE_INSTALL:append = " kernel-modules"
    PREFERRED_VERSION_python3-reedsolo = "1.7.0"
    SRC_URI:pn-mender-orchestrator = "file:///PATH/TO/mender-orchestrator-0.4.0.tar.xz"
    PREFERRED_VERSION_mender-monitor = "1.4.3"
    MENDER_ARTIFACT_NAME = "reterminal-ew2026-v1.1"
