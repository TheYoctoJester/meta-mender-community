header:
  version: 14

repos:
  meta-mender-community:
    layers:
      kas/demos/meta-mender-reterminal-demo:
      kas/demos/meta-mender-raspberrypi-wifi:
  meta-openembedded:
    layers:
      meta-python:

local_conf_header:
  reterminal-demo: |
    # Wayland / Weston kiosk
    DISTRO_FEATURES:append = " wayland opengl pam"
    DISTRO_FEATURES:remove = "x11"
    PACKAGECONFIG:append:pn-weston = " shell-kiosk"

    # Demo app theme and version (set to "v2" / "2.0" for second image)
    DEMO_APP_THEME = "v1"
    DEMO_APP_VERSION = "1.0"

    # WiFi
    DEMO_WIFI_SSID = "YOUR_SSID"
    DEMO_WIFI_PASSKEY = "YOUR_PASSKEY"
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"

    # Mender artifact versioning
    MENDER_ARTIFACT_NAME = "reterminal-demo-v1.4"

    # Mender-connect default user
    MENDER_CONNECT_USER = "mender"
    MENDER_CONNECT_SHELL = "/bin/sh"

    # Create 'mender' user
    INHERIT += "extrausers"
    EXTRA_USERS_PARAMS = "useradd -p '$6$EHVV6FtX0CwkGZOg$uNs1EOu9wui8mLZCcEIjPZehIjGVcOfMzBPvGKZz7.Lb8oi5Rmq/pOhtIcYwPUEfnlh0lDKjVIbLMYClYT64d/' -s /bin/sh mender;"

    # Mender server
    MENDER_SERVER_URL = "https://hosted.mender.io"
    MENDER_TENANT_TOKEN = "YOUR_TENANT_TOKEN"

    # Image additions
    IMAGE_INSTALL:append = " \
        weston \
        weston-init \
        mender-demo-app \
        wificonfig \
        linux-firmware-rpidistro-bcm43455 \
        kernel-module-brcmfmac \
        kernel-module-brcmfmac-wcc \
        wireless-regdb \
        mender-connect \
    "
