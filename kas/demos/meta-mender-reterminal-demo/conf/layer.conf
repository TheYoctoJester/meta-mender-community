# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-reterminal-demo"
BBFILE_PATTERN_meta-mender-reterminal-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-reterminal-demo = "7"

LAYERDEPENDS_meta-mender-reterminal-demo = "core meta-mender-seeed"
LAYERSERIES_COMPAT_meta-mender-reterminal-demo = "scarthgap"
