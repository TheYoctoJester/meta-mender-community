[Unit]
# Override meta-raspberrypi's framebuf.conf which uses a systemd device
# dependency that never activates (fb0 lacks the systemd udev tag).
# Clear those dependencies and use a poll script instead.
Requires=
After=

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /dev/fb0 ] && [ "$i" -lt 100 ]; do sleep 0.1; i=$((i+1)); done'
ExecStart=
ExecStart=/usr/bin/psplash --angle 270
