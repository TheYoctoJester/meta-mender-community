# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-readonly-overlayfs"
BBFILE_PATTERN_meta-mender-readonly-overlayfs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-readonly-overlayfs = "6"

LAYERDEPENDS_meta-mender-readonly-overlayfs = "core virtualization-layer"
LAYERSERIES_COMPAT_meta-mender-readonly-overlayfs = "scarthgap"
