# Layer config for meta-mender-rauc: manages a RAUC-updated A/B system from
# the Mender server for Yocto wrynose. RAUC stays the on-device updater; this
# layer is the Mender<->RAUC glue and provides:
#   - recipes-mender/rauc-update-module   the "rauc" v3 Mender Update Module
#                                         (rauc install / mark-good / rollback),
#                                         installed to /usr/share/mender/modules/v3/rauc.
#   - recipes-mender/mender-rauc-data     seed service + a var-lib-mender.mount
#                                         bind unit that put the mender state DB
#                                         and agent key on the /data partition so
#                                         they survive a RAUC A/B slot swap.
#   - recipes-mender/update-bundle-mender wraps the RAUC bundle (.raucb) into a
#                                         Mender artifact of payload type "rauc".
#
# The RAUC A/B machine itself (slots, bundle, u-boot bootscript) comes from
# rauc/meta-rauc-community's meta-rauc-qemuarm. See README.md for the design and
# the matching kas wrapper in mender-community-images at branch wrynose-demos.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-rauc"
BBFILE_PATTERN_meta-mender-rauc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-rauc = "15"

LAYERSERIES_COMPAT_meta-mender-rauc = "wrynose"
LAYERDEPENDS_meta-mender-rauc = "core rauc mender"
