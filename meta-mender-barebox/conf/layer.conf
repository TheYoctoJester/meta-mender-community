# Layer config for meta-mender-barebox: Mender A/B updates on Yocto wrynose
# driven by the barebox bootloader.
#
# Mender's stock rootfs-image update module owns the A/B rootfs and mutates the
# boot decision only through libubootenv's fw_setenv / fw_printenv (the same
# contract it uses for U-Boot). barebox is built to read that very same
# U-Boot-format environment via its ubootvar driver + ubootvarfs, and a small
# boot script in barebox' built-in environment reimplements Mender's U-Boot
# boot logic (mender_setup / mender_altbootcmd / mender_try_to_recover) plus the
# bootcount increment that U-Boot core would normally do. So there is no shim:
# the OS side uses the stock libubootenv tools unchanged.
#
# Provides:
#   - recipes-bsp/barebox/barebox.bbappend
#         selects the per-machine defconfig, merges a config fragment enabling
#         the U-Boot env compatibility (ubootvar + ubootvarfs) and ext4, and
#         overlays barebox' built-in environment with the Mender boot script
#         (BAREBOX_ENV_DIR) and a uboot-environment device-tree overlay.
#   - classes/mender-barebox-ab.bbclass
#         build-time half: provides the image-side glue that mender-image would
#         otherwise supply (fstab, seeded /data, bootstrap artifact) and the
#         initial U-Boot-format environment image (mkenvimage) that the wks
#         copies into the env partition raw.
#   - recipes-bsp/mender-barebox-data
#         /etc/fw_env.config pointing libubootenv at the same env partition
#         barebox reads, plus the /data/mender -> /var/lib/mender bind mount so
#         the Mender state DB survives the rootfs swap of an OTA.
#   - files/wic/*.wks.in
#         GPT layout: FAT boot/firmware, raw U-Boot env partition, two rootfs
#         slots, persistent data.
#
# See README.md for the design rationale and the matching kas wrappers in
# mender-community-images at branch wrynose-demos.

BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-mender-barebox"
BBFILE_PATTERN_meta-mender-barebox = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-barebox = "10"

LAYERVERSION_meta-mender-barebox = "1"
LAYERDEPENDS_meta-mender-barebox = "core mender"
LAYERSERIES_COMPAT_meta-mender-barebox = "wrynose"

LAYERDIR_meta-mender-barebox = "${LAYERDIR}"
