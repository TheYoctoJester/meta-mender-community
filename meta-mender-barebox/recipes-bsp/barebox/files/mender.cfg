# barebox config fragment for the Mender + barebox A/B integration.
# Merged onto the per-machine defconfig by barebox.bbclass (merge_config.sh).
#
# The U-Boot environment compatibility is the core of the integration: UBOOTVAR
# exposes the raw U-Boot-format env partition as a device, FS_UBOOTVARFS exposes
# it as a writable filesystem so /env/boot/mender can read/write the Mender
# variables, and the boot script needs ext4 (to read the kernel out of the
# selected rootfs slot), GPT partition parsing, and the shell helpers used by
# /env/boot/mender (readf, let, mount/umount, of-tree handling).

CONFIG_UBOOTVAR=y
CONFIG_FS_UBOOTVARFS=y

# Apply the uboot-environment node to the live tree (of_overlay -l in
# /env/boot/mender) so the ubootvar device probes and /dev/ubootvar0 appears.
# OF_OVERLAY_LIVE also emits __symbols__ into the barebox device tree.
CONFIG_OF_OVERLAY=y
CONFIG_OF_OVERLAY_LIVE=y
CONFIG_CMD_OF_OVERLAY=y

CONFIG_FS_EXT4=y
CONFIG_PARTITION=y
CONFIG_PARTITION_DISK=y
CONFIG_PARTITION_DISK_EFI=y

CONFIG_CMD_READF=y
CONFIG_CMD_LET=y
CONFIG_CMD_MOUNT=y
CONFIG_CMD_UMOUNT=y
CONFIG_CMD_BOOT=y
CONFIG_CMD_TEST=y
CONFIG_CMD_GLOBAL=y
CONFIG_CMD_OFTREE=y
# /env/boot/mender runs `detect -a` to enumerate the storage partitions before
# applying the env overlay. multi_v8_defconfig has it; rpi_v8a may not.
CONFIG_CMD_DETECT=y

# Boot the in-rootfs kernel via the generic bootm flow.
CONFIG_BOOTM=y
CONFIG_CMD_BOOTM=y
