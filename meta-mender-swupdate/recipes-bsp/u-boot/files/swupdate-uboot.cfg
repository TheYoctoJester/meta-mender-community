# Store the U-Boot environment as a file (uboot.env) in the FAT boot
# partition (virtio 0:1, mounted at /boot in Linux). This is what lets
# SWUpdate's bootloader handler persist the "rootpart" A/B selector and
# what our boot.scr reads/saves. The env size must match the <env size>
# field in the Linux-side fw_env.config (0x4000).
# CONFIG_ENV_IS_NOWHERE is not set
# CONFIG_ENV_IS_IN_FLASH is not set
CONFIG_ENV_IS_IN_FAT=y
CONFIG_ENV_FAT_INTERFACE="virtio"
CONFIG_ENV_FAT_DEVICE_AND_PART="0:1"
CONFIG_ENV_FAT_FILE="uboot.env"
CONFIG_ENV_SIZE=0x4000
