BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mender-swupdate"
BBFILE_PATTERN_meta-mender-swupdate = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-swupdate = "10"

LAYERSERIES_COMPAT_meta-mender-swupdate = "wrynose"

# core + mender are always required. The swupdate_%.bbappend additionally
# requires meta-swupdate (collection "swupdate") to be present -- it is
# pulled in by the qemuarm64-swupdate.yml kas config. Not declared as a
# hard LAYERDEPENDS so the layer still parses for tooling that only wants
# the recipes-mender/ content.
LAYERDEPENDS_meta-mender-swupdate = "core mender"
