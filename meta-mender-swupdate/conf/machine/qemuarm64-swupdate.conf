MACHINEOVERRIDES =. "qemuarm64:"

require ${COREBASE}/meta/conf/machine/qemuarm64.conf

KMACHINE = "qemuarm64"

include conf/machine/include/soc-family.inc

# Explicit A/B wic layout (boot + root-a + root-b + media); see
# meta-mender-swupdate/wic/image-qemu.wks.
WKS_FILE = "image-qemu.wks"

# U-Boot is the bootloader for this demo (SWUpdate's A/B selector is the
# U-Boot env variable "rootpart", written by SWUpdate's bootloader
# handler and read by our boot.scr).
EXTRA_IMAGEDEPENDS:append = " virtual/bootloader"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
IMAGE_BOOT_FILES = "u-boot.bin boot.scr.uimg"

# Support the runqemu script (qemu loads u-boot.bin as the BIOS, U-Boot's
# distroboot then auto-runs boot.scr.uimg from the FAT boot partition).
QB_DEFAULT_FSTYPE = "wic"
QB_DRIVE_TYPE = "/dev/vdb"
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_DEFAULT_BIOS = "u-boot.bin"

# Boot via u-boot.bin (BIOS) -> distroboot -> boot.scr.uimg, NOT a
# qemu-injected "-kernel Image -append" (which would bypass U-Boot and the
# A/B slot selection entirely). Needs the qemuboot QB_DEFAULT_KERNEL=none
# handling patch on openembedded-core (referenced in the kas config). Same
# approach as the plain qemuarm64.yml and the fwu/uki demos.
QB_DEFAULT_KERNEL = "none"
QB_KERNEL_ROOT = ""

# Consumed by the sw-description / swupdate-args templating to point
# SWUpdate at the inactive rootfs slot.
OTA_PARTITION_A = "vda2"
OTA_PARTITION_B = "vda3"

IMAGE_FSTYPES:append = " ext4.gz wic wic.bmap"
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image"
do_image_wic[depends] += "mtools-native:do_populate_sysroot dosfstools-native:do_populate_sysroot virtual/bootloader:do_deploy swupdate-bootscr:do_deploy"
