# Layer config for meta-mender-uki: wires Mender A/B updates into a
# UKI-style build for Yocto wrynose. Provides:
#   - classes/uki-mender-ab.bbclass    builds uki-{a,b}.efi via two ukify
#                                      invocations with different baked
#                                      root= cmdlines, plus an initial
#                                      loader.conf naming uki-a.efi.
#   - recipes-bsp/mender-uki-shim      fw_setenv/fw_printenv shim + a
#                                      tmpfiles snippet + a
#                                      var-lib-mender.mount unit that
#                                      bind-mounts /data/mender over
#                                      /var/lib/mender (so the mender
#                                      state DB + agent key survive the
#                                      rootfs swap of an OTA).
#   - files/wic/efi-uki-mender-bootdisk.wks.in
#                                      4-part GPT (256M ESP, two 1G
#                                      rootfs slots, 64M data).
#
# See README.md for the design rationale, the four runtime quirks that
# informed each component, and the matching kas wrapper in
# mender-community-images at branch wrynose-demos.

BBPATH .= ":${LAYERDIR}"
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-mender-uki"
BBFILE_PATTERN_meta-mender-uki = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mender-uki = "10"

LAYERSERIES_COMPAT_meta-mender-uki = "wrynose"
LAYERDEPENDS_meta-mender-uki = "core mender"

LAYERDIR_meta-mender-uki = "${LAYERDIR}"
