# Multiconfig for the meta-mender-uki demo's initramfs.
#
# Builds INITRAMFS_IMAGE (core-image-minimal-initramfs) in its own TMPDIR -- and
# therefore its own deploy-images dir -- so it never shares a deploy dir with
# the main UKI core-image-minimal build. uki-mender-ab.bbclass pulls it via
# mcdepends and stages it into the UKI image's deploy dir for ukify.
#
# Everything except TMPDIR is inherited from the build's local.conf (MACHINE,
# DISTRO, SSTATE_DIR, DL_DIR, ...), so this yields the same initramfs as the
# stock same-config build -- only its deploy location differs.
TMPDIR = "${TOPDIR}/tmp-uki-initramfs"
